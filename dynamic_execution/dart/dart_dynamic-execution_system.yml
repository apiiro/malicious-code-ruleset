rules:
  - id: dart-dynamic-system-commands
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: Process.$RUN('dart', ['-e', ...]);
              - pattern: |
                  {
                    ...
                    $P = Process;
                    ...
                    $P.$RUN('dart', ['-e', ...]);
                    ...
                  }
              - patterns:
                  - pattern: $P.$RUN('dart', ['-e', ...]);
                  - pattern-either:
                      - pattern-inside: |
                          final $P = Process;
                          ...
                      - pattern-inside: |
                          $TYPE $P = Process;
                          ...
          - metavariable-pattern:
              metavariable: $RUN
              pattern-regex: (run|runSync|start)
          - focus-metavariable: $RUN
    message: Dynamic execution by system commands.
    severity: ERROR
    languages:
      - dart